# ribbon-snmp-forwarder configuration
# Environment variables prefixed with SNMPFWD_ override any value below.
# Example: SNMPFWD_KAFKA_BROKERS=broker1:9092,broker2:9092

log:
  # level: debug | info | warn | error
  level: info
  # format: json | console
  format: json

snmp:
  trap:
    # UDP address the trap listener will bind to.
    # Use 0.0.0.0:162 for all interfaces; requires CAP_NET_BIND_SERVICE or root.
    listen_address: "0.0.0.0:162"
    # SNMPv2c community string that traps must carry to be accepted.
    community: "public"

  poll:
    # Set to false to disable active polling (trap-only mode).
    enabled: true
    # host:port of the Ribbon SBC to poll.
    target: "192.168.1.1:161"
    # SNMPv2c read community string for polling.
    community: "public"
    # How often (in seconds) to run a full poll cycle.
    interval_seconds: 60
    # SNMP request timeout in seconds.
    timeout_seconds: 5
    # Number of retries on timeout before giving up.
    retries: 2
    # OID subtrees to walk each poll cycle.
    # 1.3.6.1.2.1.1    = sysDescr / System MIB
    # 1.3.6.1.2.1.2    = Interfaces MIB
    # 1.3.6.1.4.1.2879 = Ribbon/GENBAND enterprise OIDs
    oids:
      - "1.3.6.1.2.1.1"
      - "1.3.6.1.2.1.2"
      - "1.3.6.1.4.1.2879"

kafka:
  # Bootstrap broker addresses.
  brokers:
    - "localhost:9092"
  # Topic to publish telemetry events to.
  topic: "snmp-telemetry"
  # Producer client identifier (used for Kafka logging/metrics).
  client_id: "ribbon-snmp-forwarder"
